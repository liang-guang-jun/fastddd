# =============================================================================
#  fastddd - project metadata and tooling.
#
# This single file drives the whole Python side of the repository:
#   [project] / [dependency-groups] -> uv
#   [build-system]                   -> hatchling
#   [tool.ruff*]                     -> linting, import order and formatting
#   [tool.mypy*]                     -> static typing
#   [tool.pytest.ini_options]        -> test discovery and defaults
#   [tool.coverage*]                 -> coverage thresholds
# =============================================================================

# -----------------------------------------------------------------------------
# Project metadata
# -----------------------------------------------------------------------------
[project]
name = "fastddd"
version = "0.1.0"
description = "backend service."
readme = "README.md"
authors = [{ name = "GUANGJUN LIANG", email = "guangjun_l@icloud.com" }]
# Keep this in sync with [tool.ruff].target-version and [tool.mypy].python_version.
requires-python = ">=3.13"
# Runtime dependencies: everything `fastddd` may import while the service runs.
# Database *drivers* are deliberately absent -- see the extras below.
dependencies = [
  "alembic>=1.20.0",
  "cryptography>=44.0.0",
  "dependency-injector>=4.49.1",
  "fastapi>=0.141.1",
  "pwdlib[argon2]>=0.3.1",
  "pydantic>=2.13.5",
  "pyjwt>=2.14.0",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0.3",
  "sqlalchemy[asyncio]>=2.0.54",
  "structlog>=25.5.0",
  "typer>=0.27.2",
  "uvicorn[standard]>=0.53.0",
]

# Optional extras: one per database backend, so a deployment installs only the
# driver it actually connects with -- `uv sync --extra postgres`, or a
# `fastddd[postgres]` install. SQLAlchemy and Alembic stay runtime: they are the
# engine, not a driver, and `create_database_backend` imports the driver lazily,
# only when a connection is opened.
#
# Lakebase speaks PostgreSQL through asyncpg, so its extra repeats that driver
# rather than referring to this project by name.
[project.optional-dependencies]
sqlite = ["aiosqlite>=0.22.1"]
postgres = ["asyncpg>=0.30.0"]
databricks = ["asyncpg>=0.30.0", "databricks-sdk>=0.147.0"]

# [project.scripts]
# fastddd = "examples.cli:app"

# -----------------------------------------------------------------------------
# Build
# -----------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `fastddd` is the import package: the repository root is also the import root.
packages = ["fastddd"]

# -----------------------------------------------------------------------------
# Dependency groups -- tooling that is never part of the published package
# -----------------------------------------------------------------------------
[dependency-groups]
# Installed by a plain `uv sync` / used by `uv run <tool>`. Development runs
# PostgreSQL, so that driver lives here rather than behind an extra; SQLite is a
# deployment choice and stays in the `sqlite` extra -- except here, where it is
# the only database the test suite can open hermetically (in memory, no server).
dev = [
  "aiosqlite>=0.22.1",
  "asyncpg>=0.30.0",
  "httpx2>=0.28.0",
  "mypy>=2.3.1",
  "pathspec>=1.0.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "python-dotenv>=1.0.0",
  "rich>=15.0.0",
  "ruff>=0.16.8",
  "tenacity>=9.1.4",
  "types-pyyaml>=6.0.12.20260906",
]
# Site tooling only: `uv sync --group docs`.
docs = ["mkdocs>=1.6.1", "mkdocs-material>=9.7.7"]

# -----------------------------------------------------------------------------
# Ruff -- linting and formatting (https://docs.astral.sh/ruff/)
# -----------------------------------------------------------------------------
[tool.ruff]
# 88 characters balances readability and practicality.
line-length = 88
# Keep in sync with requires-python.
target-version = "py313"
# Declare the source roots so Ruff resolves first-party imports correctly: the
# package sits at the repository root, next to `tests/` and `examples/`.
src = ["."]

# Directories that never contain hand-written code.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "venv",
  "__pycache__",
  "build",
  "dist",
  # Alembic migrations are generated and edited outside the lint contract, so
  # any ``migrations`` tree is exempt -- the same boundary mypy draws with its
  # ``(^|/)migrations/`` exclude. A migration command may be pointed at any
  # directory, and a tree that was generated must never fail the lint gate.
  "**/migrations",
]

[tool.ruff.lint]
select = [
  "F",     # Pyflakes: real errors (undefined names, unused imports, ...)
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "D",     # pydocstyle: docstring conventions
  "I",     # isort: import order
  "N",     # pep8-naming
  "B",     # flake8-bugbear: likely bugs
  "C4",    # flake8-comprehensions
  "UP",    # pyupgrade: modern syntax for the target version
  "RUF",   # Ruff-specific rules
  "ASYNC", # flake8-async: blocking calls inside async code
]
# Rules that fight the formatter or are stricter than this project wants.
ignore = [
  "E501", # line length is the formatter's job
]

[tool.ruff.lint.pydocstyle]
# Google style; it also settles the D203/D211 and D212/D213 conflicts that the
# bare D rule set would report for every docstring.
convention = "google"

[tool.ruff.lint.per-file-ignores]
# A package marker is a marker, not a module: it needs no docstring of its own.
"**/__init__.py" = ["D104"]
# Test functions need no object-level docstrings; module docstrings remain
# required by D100.
"tests/**" = ["D101", "D102", "D103", "D104", "D107"]
# IAM is being introduced incrementally; its public API is covered by strict
# typing/tests while documentation is completed alongside each use-case slice.
"fastddd/iam/**" = [
  "F401",
  "F403",
  "F405",
  "I001",
  "B009",
  "E701",
  "E702",
  "UP035",
]
"fastddd/catalog/**" = [
  "F401",
  "F403",
  "F405",
  "I001",
  "B009",
  "E701",
  "E702",
  "UP035",
  "RUF022",
]
# Alembic generates these files itself (irregular module names, unused imports
# in empty revisions, no docstrings). `fastddd/migrations` is excluded outright
# above; this pattern covers generated trees placed anywhere else.
"**/alembic/versions/**" = ["N999", "F401"]

# Make isort treat `fastddd` as first-party.
[tool.ruff.lint.isort]
known-first-party = ["fastddd"]

[tool.ruff.format]
# Double quotes and space indentation, i.e. the Black-compatible defaults.
quote-style = "double"
indent-style = "space"
# Also format the code examples embedded in docstrings.
docstring-code-format = true

# -----------------------------------------------------------------------------
# mypy -- static typing
# -----------------------------------------------------------------------------
[tool.mypy]
# Keep in sync with requires-python.
python_version = "3.13"
# Strict is the recommended starting point for a new project.
strict = true
warn_return_any = true
warn_unused_ignores = true
# Also flag code that can never run, e.g. a branch a narrowing already excludes.
warn_unreachable = true
show_error_codes = true
show_error_context = true
warn_unused_configs = true
# Understand pydantic's generated code (extra fields, aliases, required fields).
plugins = ["pydantic.mypy"]
# Alembic migrations are generated and edited outside the strict typing contract.
exclude = ["(^|/)migrations/"]
# Derive each module's name from its path relative to the repository root instead
# of from the nearest directory without an __init__.py. Without this, the test
# trees (which intentionally ship no __init__.py) would both declare a top-level
# "conftest" module and mypy would reject the second one as a duplicate.
explicit_package_bases = true
mypy_path = "."

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# -----------------------------------------------------------------------------
# pyright / Pylance -- IntelliSense only
# -----------------------------------------------------------------------------
[tool.pyright]
# mypy (see above) is this project's type checker, so the editor's language
# server runs without type checking. These four rules are the ones that stay
# enabled even in "off" mode, and they are the warnings this project does not
# want.
#
# This block is the single source of Pylance configuration: a pyproject.toml
# carrying [tool.pyright] outranks `.vscode/settings.json`, which is why the
# matching python.analysis.* settings are not duplicated there (Pylance flags
# them with "cannot be set when a pyrightconfig.json or pyproject.toml is being
# used" and ignores them). The pyright CLI reads this same block.
#
# `typeCheckingMode` must stay explicit: the default for a config file is
# "standard", not the editor's "off".
typeCheckingMode = "off"
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportInvalidTypeForm = "none"
reportUndefinedVariable = "none"

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------]
[tool.pytest.ini_options]
# Where tests live, and what pytest treats as a test.
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
# pytest-asyncio's "auto" mode: `async def test_...` needs no marker.
asyncio_mode = "auto"
addopts = [
  "-v",                        # one line per test
  "--tb=short",                # short tracebacks
  "--strict-markers",          # a mistyped marker is an error, not a warning
  "--strict-config",           # same for a mistyped option in this file
  "--import-mode=importlib",   # keep test module names unique across test trees
  "-ra",                       # summary of every non-passing result
  "--cov=fastddd",             # coverage of the package (pytest-cov)
  "--cov-report=term-missing", # show the lines that are not covered
]
markers = [
  "slow: marks tests that take a long time to run",
  "integration: marks tests that need real infrastructure (database, ...)",
]
# Warnings are errors; only DeprecationWarnings from dependencies are allowed.
filterwarnings = ["error", "ignore::DeprecationWarning"]

# -----------------------------------------------------------------------------
# coverage.py (driven by pytest-cov)
# -----------------------------------------------------------------------------
[tool.coverage.run]
source = ["fastddd"]
branch = true
# SQLAlchemy's async engine runs the DBAPI work inside greenlets, so the tracer
# has to follow those switches; without this, work that happens while a
# connection is being set up -- the SQLite PRAGMA hook, for one -- runs without
# being counted.
concurrency = ["thread", "greenlet"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
# Added on top of coverage's built-in exclusions (`# pragma: no cover`,
# `raise NotImplementedError`, `if 0:`, ...), so those stay in effect.
exclude_also = ["if TYPE_CHECKING:", "@abstractmethod"]
# Below this the run fails; raise the bar as the suite grows.
fail_under = 80
